apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: homelab

spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: 192.168.43.128:30080/homelab/kubernetes-homelab-web:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: postgres-secret
            - configMapRef:
                name: fastapi-config
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
